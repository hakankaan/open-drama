name: Shot
description: >-
  One storyboard segment of an episode. Owns its description, atmosphere, duration, bindings, prompts (the keyframe's,
  stored as the image prompt, and the video's) with the video prompt's staleness, reference media, its keyframe, whether
  it continues the shot before it in one take, its spoken line with its speaker and line audio, and the current video
  plus its generation history (each version with its model, seed, the references it left out, the keyframe or the
  previous shot's frame it started from, and whether it is a lip sync of another version), and the vision service's
  check of the current video.
handles:
  commands:
    - SaveShots
    - CreateShot
    - UpdateShot
    - DeleteShot
    - GenerateShotVideoPrompt
    - RequestShotVideo
    - AttachShotVideo
    - RequestShotKeyframe
    - AttachShotKeyframe
    - RequestLineAudio
    - AttachLineAudio
    - RequestLipSync
    - AttachLipSyncedVideo
    - CheckShot
emits:
  events:
    - ShotsSaved
    - ShotCreated
    - ShotUpdated
    - ShotDeleted
    - ShotVideoPromptSaved
    - ShotVideoRequested
    - ShotVideoAttached
    - ShotKeyframeRequested
    - ShotKeyframeAttached
    - LineAudioRequested
    - LineAudioAttached
    - LipSyncRequested
    - LipSyncedVideoAttached
    - ShotChecked
invariants:
  - shotNumber is unique within the episode; batch saves upsert by shotNumber so retries never duplicate.
  - sceneId, characterIds and propIds must belong to the drama; binding an asset not yet linked to the episode links it.
  - >-
    durationSeconds is between 2 and 30 (agents target 8-15, within what the video model renders); the episode's derived
    duration is the sum of live shot durations.
  - A video request needs at least one reference asset or a non-empty video prompt.
  - >-
    videoPromptStale is set when a field the video prompt was written from changes after it was written (duration,
    description, atmosphere, framing, scene or bound characters and props), since the prompt carries per-second timings;
    any write of the video prompt clears it, except a generated prompt whose sources changed while it was being written,
    which stays stale. A stale prompt is not blocked from generation; the video-prompt batch picks it up by default.
  - >-
    The current video is the most recent successful generation unless the creator picks another from history; the task
    behind the current video cannot be deleted from history.
  - Reference images beyond the video provider's limit are left out (bound assets first) and reported to the creator.
  - >-
    A shot with a keyframe starts its video from it on a model that takes a first frame, unless the request says
    otherwise or carries reference video or audio; such a request sends the keyframe alone, without reference images.
    The keyframe's own task cannot be deleted while it is the shot's keyframe, and only a stored file can be set as one.
  - >-
    A keyframe is stale while what it is drawn from changed after it was drawn: the cast, the scene, the framing, the
    image prompt (or, while that is empty, the fields a prompt is composed from), a bound asset's picture or lighting,
    or a bound character's outfit in the episode. A keyframe drawn while such a change was made stays stale; a new
    keyframe, an uploaded one or the creator's "still fits" makes it fresh. A stale keyframe is still used.
  - >-
    A shot marked as continuing the previous one (the previous live shot by number) starts its video from that shot's
    last frame instead of its keyframe, on a model that takes a first frame and without reference video or audio; the
    first shot's mark means nothing, and at most two shots in a row continue the one before. Its request waits while the
    previous shot's video is generating and fails when that fails; one is refused while the previous shot has no video
    and none generating. A request still waiting when the server restarts is picked up again and waits for the same
    video. A continued video no longer joins once the shot before plays another video; the merge cuts there and the
    studio says so.
  - >-
    A shot has at most one speaker, one of its bound characters other than a narrator, and one line (at most 1000
    characters, the words only). Unbinding the speaker, deleting it, or changing the line, the speaker or the speaker's
    voice or sample clears the line audio.
  - >-
    Line audio grows the shot to hold half a second of lead-in, the line and half a second after it (never shrinking it,
    at most 30 seconds) and marks the video prompt stale.
  - >-
    Under pinned voices a shot with a line needs its line audio before a video is requested, and the line after its
    lead-in must fit the length the model makes; the video is made silent, its prompt names who speaks with their face
    clearly visible (and says nobody speaks in a shot without a line), and LipSyncPinnedVideo syncs it once it is done.
  - >-
    A lip sync starts from the shot's current video, or the video a current lip sync was made from, never from a synced
    copy, and is refused when the line after its lead-in does not fit that video. Its result becomes the current video
    only while the shot still plays the source and has the same line audio.
  - >-
    A check belongs to the video it judged: it is stored only while the shot still plays that video, and is not shown
    once the shot plays another. It is a signal for the creator, never a gate on generation or the merge.
