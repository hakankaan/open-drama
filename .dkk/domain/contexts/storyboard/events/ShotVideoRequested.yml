name: ShotVideoRequested
description: A video generation was requested for a shot with the fully resolved prompt, references and parameters.
fields:
  - name: shotId
    type: ID
  - name: dramaId
    type: ID
  - name: prompt
    type: string
  - name: videoServiceId
    type: ID
  - name: model
    type: string
  - name: durationSeconds
    type: number
  - name: aspectRatio
    type: string
  - name: resolution
    type: string
  - name: referenceImageUrls
    type: string[]
  - name: referenceVideoUrls
    type: string[]
  - name: referenceAudioUrls
    type: string[]
  - name: seed
    type: number
  - name: droppedReferences
    type: string[]
  - name: firstFrame
    type: string
    description: The keyframe the video started from, when it was sent, or the frame taken from the shot it continues
  - name: chainedFrom
    type: object
    description: The shot it continues, and once taken the video and time of the frame it started from
raised_by: Shot
adr_refs:
  - adr-0017
  - adr-0020
