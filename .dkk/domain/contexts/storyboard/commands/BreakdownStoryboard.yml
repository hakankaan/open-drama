# Command — an instruction to change domain state.
name: BreakdownStoryboard
description: Ask the storyboard-breaker agent to split the episode's script into shots with descriptions, atmosphere, durations, bindings and video prompts, replacing the current shots (which are parked until the job succeeds). Runs asynchronously; the UI polls. Returns the running job if one exists.
fields:
  - name: episodeId
    type: ID
  - name: model
    type: string
  - name: textServiceId
    type: ID
actor: Creator
handled_by: StoryboardBreakdown
preconditions:
  - The episode has a script
  - Assets have been extracted (bindings need candidates)
rejections:
  - Episode has no script
