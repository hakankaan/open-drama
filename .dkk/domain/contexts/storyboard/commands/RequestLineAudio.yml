name: RequestLineAudio
description: >-
  Speak the shot's line in its speaker's voice with the speech service, in the content language. A speech model that
  clones gets the speaker's voice sample when there is one; otherwise the speaker's named voice is used, which must be
  one of the model's voices.
fields:
  - name: shotId
    type: ID
  - name: model
    type: string
  - name: speechServiceId
    type: ID
actor: Creator
handled_by: Shot
preconditions:
  - The shot has a line and a speaker who is one of its bound characters
  - The speaker has a voice the speech model offers, or a voice sample it can clone
rejections:
  - No speech model service configured
  - The line is already being spoken for this shot
  - A breakdown of the episode is running
  - A speech model that takes no named voice, for a speaker without a sample it can clone
adr_refs:
  - adr-0021
