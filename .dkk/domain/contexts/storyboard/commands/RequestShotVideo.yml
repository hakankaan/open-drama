name: RequestShotVideo
description: Generate a video for the shot. Builds the ordered reference list — the bound scene, then bound characters, then bound props (assets without an image skipped), then any extra images supplied in the request — deduplicated and capped by the provider's limit; rewrites each @[Name] mention in the prompt into the matching reference slot (the adapter renders the provider's token syntax, or plain text when the provider has none); prepends the drama's style prompt; applies the episode resolution and the drama aspect ratio; uses the episode's locked video service unless a service or model override is given. Batch generation and retry-failed issue this once per shot, so a shot whose latest video task is still processing is rejected.
fields:
- name: shotId
  type: ID
- name: prompt
  type: string
  description: Video prompt (defaults to the shot's)
- name: model
  type: string
- name: videoServiceId
  type: ID
- name: durationSeconds
  type: number
- name: extraReferenceImageUrls
  type: string[]
  description: Optional extra images appended after the bound assets' reference images
- name: referenceVideoUrls
  type: string[]
- name: referenceAudioUrls
  type: string[]
- name: generateAudio
  type: boolean
actor: Creator
handled_by: Shot
preconditions:
- At least one reference asset or a non-empty prompt
- Reference counts within the provider's limits
rejections:
- No video model service configured
- Reference audio without any reference image or video
- Reference material over the provider's limits
- A video task for this shot is still processing
adr_refs:
- adr-0005
- adr-0009
