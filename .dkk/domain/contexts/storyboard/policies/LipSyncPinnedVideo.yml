name: LipSyncPinnedVideo
description: >-
  Under pinned voices, a silent video made for a spoken line is lip-synced as soon as it is attached, to the line audio
  its length was fitted to. A sync that cannot start (the line changed meanwhile, no lip-sync service) is recorded as a
  failed lip-sync task so the shot shows why its video has no voice. Nothing is requested once the shot's episode (or
  its drama) was deleted.
when:
  events:
    - ShotVideoAttached
then:
  commands:
    - RequestLipSync
adr_refs:
  - adr-0021
