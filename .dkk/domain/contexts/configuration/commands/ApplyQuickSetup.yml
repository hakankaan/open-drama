name: ApplyQuickSetup
description: >-
  From one API key of a compatible gateway, write the recommended services (text, image, video, and on ModelRunner
  speech, lip sync and vision) with preset base URLs and default models in a single step, then probe each.
fields:
  - name: apiKey
    type: string
  - name: gateway
    type: string
    description: Which recommended template set to apply
actor: Creator
handled_by: ModelService
rejections:
  - Empty API key
adr_refs:
  - adr-0021
  - adr-0022
