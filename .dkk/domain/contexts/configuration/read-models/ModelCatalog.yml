name: ModelCatalog
description: >-
  The ModelRunner endpoints a service of one type can use, with their USD prices (per million tokens, per image, or per
  output second over the resolution tiers). Read live from ModelRunner's public catalog each time the service dialog
  asks and never stored; image and video list the mode endpoints the adapter offers by category and name (text-to-video
  and reference-to-video; text-to-image and edit). No per-entry input schema is read here. Picking one adds it to the
  service's models.
fields:
  - name: id
    type: string
  - name: name
    type: string
  - name: description
    type: string
  - name: price
    type: CatalogPrice
subscribes_to: []
used_by:
  - Creator
adr_refs:
  - adr-0013
