name: Character
description: >-
  A person in the drama with appearance and styling descriptions, an optional role, a final prompt describing the
  person, and reference views: a headshot, a full body, optional side and back views, and a multi-view sheet kept from
  before views or uploaded (adr-0018), and the voice its lines are spoken in: one of the speech model's voices and a
  recording of its voice, cloned by speech models that clone (adr-0021). Shared across the drama's episodes through
  episode links, each of which may give it another outfit and a full-body picture of it for that episode (adr-0023).
handles:
  commands:
    - CreateCharacter
    - UpdateCharacter
    - DeleteCharacter
    - SaveExtractedCharacters
    - GenerateCharacterFinalPrompt
    - SaveCharacterFinalPrompt
    - RequestCharacterImage
    - SetEpisodeOutfit
    - RequestOutfitImage
emits:
  events:
    - CharacterCreated
    - CharacterUpdated
    - CharacterDeleted
    - CharactersExtracted
    - CharacterFinalPromptSaved
    - CharacterImageRequested
    - CharacterImageAttached
    - EpisodeOutfitSet
    - OutfitImageRequested
    - OutfitImageAttached
invariants:
  - >-
    name is required and unique per drama after near-name normalisation; extraction reuses an existing match instead of
    creating a duplicate.
  - >-
    Changing appearance or styling keeps finalPrompt but sets finalPromptStale; an explicit finalPrompt in an update
    always wins and clears the flag.
  - The saved final prompt always starts with the drama's style prompt fragment.
  - Deletion is a soft delete and removes the character from every episode of the drama.
  - >-
    Body, side and back views are generated from the headshot as their reference image; a generated headshot of a
    character without one is drawn from its sheet.
  - >-
    A voice must be one of the default speech model's voices when there is a speech service. Changing the voice or the
    voice sample, or deleting the character, clears the line audio of the shots it speaks in; deleting it also removes
    it as their speaker.
  - >-
    In an episode where it wears an outfit, its shots send the headshot and the outfit picture as the full body, never
    the side, back or (while a headshot exists) sheet views, and its prompts describe the outfit instead of the
    styling. An outfit picture lands only while the outfit is still the one it was drawn for; while it is drawn, the
    character's views and that picture cannot be changed.
adr_refs:
  - adr-0018
  - adr-0021
  - adr-0023
