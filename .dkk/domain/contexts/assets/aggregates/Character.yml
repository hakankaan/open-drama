name: Character
description: >-
  A person in the drama with appearance and styling descriptions, an optional role, a final prompt describing the
  person, and reference views: a headshot, a full body, optional side and back views, and a multi-view sheet kept from
  before views or uploaded (adr-0018). Shared across the drama's episodes through episode links.
handles:
  commands:
    - CreateCharacter
    - UpdateCharacter
    - DeleteCharacter
    - SaveExtractedCharacters
    - GenerateCharacterFinalPrompt
    - SaveCharacterFinalPrompt
    - RequestCharacterImage
emits:
  events:
    - CharacterCreated
    - CharacterUpdated
    - CharacterDeleted
    - CharactersExtracted
    - CharacterFinalPromptSaved
    - CharacterImageRequested
    - CharacterImageAttached
invariants:
  - >-
    name is required and unique per drama after near-name normalisation; extraction reuses an existing match instead of
    creating a duplicate.
  - >-
    Changing appearance or styling keeps finalPrompt but sets finalPromptStale; an explicit finalPrompt in an update
    always wins and clears the flag.
  - The saved final prompt always starts with the drama's style prompt fragment.
  - Deletion is a soft delete and removes the character from every episode of the drama.
  - >-
    Body, side and back views are generated from the headshot as their reference image; a generated headshot of a
    character without one is drawn from its sheet.
adr_refs:
  - adr-0018
