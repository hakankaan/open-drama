name: ExtractionJob
description: A running extraction for one episode and one target type (characters, scenes or props). Tracks running / done / failed with timestamps so the UI can poll; at most one job per episode and type runs at a time, and the three types may run in parallel.
handles:
  commands:
  - StartExtraction
emits:
  events:
  - ExtractionStarted
  - ExtractionCompleted
  - ExtractionFailed
invariants:
- Key is (episodeId, target); starting while running returns the running job (alreadyRunning) instead of a second run.
- Jobs are persisted so an API restart marks any running job as failed instead of leaving it running forever.
adr_refs:
- adr-0008
