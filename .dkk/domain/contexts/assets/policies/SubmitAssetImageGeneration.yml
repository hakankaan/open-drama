name: SubmitAssetImageGeneration
description: >-
  When an asset image is requested, submit an image generation task tagged with the asset id
  (generation.SubmitImageGeneration — cross-context, see flow AssetStage). A character's headshot uses a square canvas
  and its other views 9:16 with the headshot as reference image; props a square canvas, scenes the drama's aspect
  ratio.
when:
  events:
    - CharacterImageRequested
    - SceneImageRequested
    - PropImageRequested
adr_refs:
  - adr-0018
