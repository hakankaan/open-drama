name: EpisodeAssets
description: >-
  The assets stage of the workbench — characters, scenes and props linked to the episode with their fields, final
  prompt, reference image (plus thumbnail), readiness (ready / generating / pending) and the extraction job status per
  type; each character also carries its outfit in the episode, the outfit picture and the latest outfit task
  (adr-0023).
fields:
  - name: episodeId
    type: ID
  - name: characters
    type: EpisodeCharacterCard[]
  - name: scenes
    type: SceneCard[]
  - name: props
    type: PropCard[]
  - name: extraction
    type: ExtractionStatusByTarget
subscribes_to:
  - CharactersExtracted
  - ScenesExtracted
  - PropsExtracted
  - CharacterUpdated
  - SceneUpdated
  - PropUpdated
  - CharacterImageAttached
  - EpisodeOutfitSet
  - OutfitImageAttached
  - SceneImageAttached
  - PropImageAttached
  - ExtractionStarted
  - ExtractionCompleted
  - ExtractionFailed
used_by:
  - Creator
adr_refs:
  - adr-0023
