name: DramaAssetLibrary
description: >-
  The drama-wide asset library tab on the project page — every character, scene and prop of the drama regardless of
  episode, with image, final prompt and edit/generate/delete affordances. Prompts and images are generated from here
  without an episode, in the project's image service (adr-0024), so a cast can be drawn before episode 1.
fields:
  - name: dramaId
    type: ID
  - name: characters
    type: CharacterCard[]
  - name: scenes
    type: SceneCard[]
  - name: props
    type: PropCard[]
subscribes_to:
  - CharacterCreated
  - CharacterUpdated
  - CharacterDeleted
  - SceneCreated
  - SceneUpdated
  - SceneDeleted
  - PropCreated
  - PropUpdated
  - PropDeleted
used_by:
  - Creator
adr_refs:
  - adr-0016
  - adr-0024
