name: EpisodeOutfitSet
description: >-
  A character's outfit or its picture in an episode changed (adr-0023), set by the creator or written by an extraction
  that dressed the character from the script (adr-0024); the keyframes of the episode's shots with the character are now
  stale.
fields:
