name: GeneratePropFinalPrompt
description: >-
  Run the prompt-generator agent to write the white-background product-shot final prompt for a prop (force regenerates).
  Persisted through SavePropFinalPrompt.
fields:
  - name: propId
    type: ID
  - name: episodeId
    type: ID
    description: Optional (adr-0024); with one the agent runs in the episode's context, without one in the drama's
  - name: force
    type: boolean
  - name: model
    type: string
  - name: textServiceId
    type: ID
actor: Creator
handled_by: Prop
rejections:
  - Agent finished without saving a prompt
  - The prop is claimed while the agent would run (its image, description or another prompt in progress, 409); an up-to-date prompt without force is returned as is
adr_refs:
  - adr-0016
  - adr-0024
