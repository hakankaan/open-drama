name: GenerateSceneFinalPrompt
description: >-
  Run the prompt-generator agent to write the empty establishing-shot final prompt for a scene (force regenerates).
  Persisted through SaveSceneFinalPrompt.
fields:
  - name: sceneId
    type: ID
  - name: episodeId
    type: ID
    description: Optional (adr-0024); with one the agent runs in the episode's context, without one in the drama's
  - name: force
    type: boolean
  - name: model
    type: string
  - name: textServiceId
    type: ID
actor: Creator
handled_by: Scene
rejections:
  - Agent finished without saving a prompt
adr_refs:
  - adr-0024
