name: DesignAssets
description: >-
  Start the asset designer on the whole drama for one kind (characters, scenes or props), from the story outline
  (adr-0024). Returns at once; the Story tab polls the job. The studio starts the three kinds together, and the three
  run in parallel. Optionally overrides the text model or service for the run.
fields:
  - name: dramaId
    type: ID
  - name: target
    type: string
    description: characters | scenes | props
  - name: model
    type: string
  - name: textServiceId
    type: ID
actor: Creator
handled_by: DesignJob
preconditions:
  - The drama has a story outline
  - No outline job is running for the drama
rejections:
  - Unknown target
  - No outline yet (412, write the outline first)
  - The outline is being written (409)
adr_refs:
  - adr-0016
  - adr-0024
