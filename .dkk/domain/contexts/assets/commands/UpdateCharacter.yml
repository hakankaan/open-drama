name: UpdateCharacter
description: >-
  Edit a character's fields, manually set its final prompt, attach or remove an uploaded or generated image per view
  (adr-0018), or set its voice and voice sample (adr-0021). Editing appearance or styling marks the final prompt stale
  (it is kept); a finalPrompt supplied in the same request wins and clears the stale flag.
fields:
  - name: characterId
    type: ID
  - name: name
    type: string
  - name: role
    type: string
  - name: appearance
    type: string
  - name: styling
    type: string
  - name: finalPrompt
    type: string
  - name: views
    type: object
    description: >-
      Partial map of view (headshot, body, side, back, sheet) to the local media path of an uploaded or generated image;
      null removes the view
  - name: voice
    type: string
    description: One of the speech model's voices, or empty for none; a change clears the line audio of the shots it speaks in
  - name: voiceSamplePath
    type: string
    description: An uploaded recording of the character's voice, cloned by a speech model that clones; null removes it
actor: Creator
handled_by: Character
rejections:
  - Views change while an image of the character is generating
adr_refs:
  - adr-0016
  - adr-0018
  - adr-0021
