name: UpdateCharacter
description: Edit a character's fields, manually set its final prompt, or attach an uploaded or generated reference image. Editing appearance or styling marks the final prompt stale (it is kept); a finalPrompt supplied in the same request wins and clears the stale flag.
fields:
- name: characterId
  type: ID
- name: name
  type: string
- name: role
  type: string
- name: appearance
  type: string
- name: styling
  type: string
- name: finalPrompt
  type: string
- name: imagePath
  type: string
  description: Local media path of an uploaded or generated image
actor: Creator
handled_by: Character
