# Command — an instruction to change domain state.
name: SaveExtractedProps
description: Batch upsert from the extractor agent's save_dedup_props tool (an empty list is valid). Matches by exact or near name; merges keep the id and clear a stale final prompt when the description changed.
fields:
  - name: episodeId
    type: ID
  - name: dramaId
    type: ID
  - name: props
    type: "ExtractedProp[]"
    description: name, type, description
actor: AgentRuntime
handled_by: Prop
