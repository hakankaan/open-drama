name: SetEpisodeOutfit
description: >-
  Set what a character wears in one episode instead of its styling, and the full-body picture of that outfit (adr-0023).
  A changed outfit drops the picture unless the same request gives one; an empty outfit wears the character's own
  styling and views and keeps no picture. A changed outfit or picture marks the keyframes of the episode's shots with
  the character stale (adr-0019).
fields:
  - name: characterId
    type: ID
  - name: episodeId
    type: ID
  - name: outfit
    type: string
    description: at most 2000 characters; empty wears the character's styling
  - name: outfitPath
    type: string
    description: a stored image, or null to remove the picture
actor: Creator
handled_by: Character
preconditions:
  - The character is live and linked to a live episode of its drama
rejections:
  - The character, the episode or the link does not exist
  - A picture is given without an outfit
  - The picture is not a stored file
  - A picture is given or removed while one is being drawn
adr_refs:
  - adr-0019
  - adr-0023
