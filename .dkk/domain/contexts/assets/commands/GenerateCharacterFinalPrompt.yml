name: GenerateCharacterFinalPrompt
description: >-
  Run the prompt-generator agent to write the final prompt for a character, describing the person only: the studio
  frames it per view (adr-0018). Force regenerates even if one exists. The agent persists through
  SaveCharacterFinalPrompt; the command waits for the run.
fields:
  - name: characterId
    type: ID
  - name: episodeId
    type: ID
    description: Optional (adr-0024); with one the agent runs in the episode's context, without one in the drama's
  - name: force
    type: boolean
  - name: model
    type: string
  - name: textServiceId
    type: ID
actor: Creator
handled_by: Character
rejections:
  - Agent finished without saving a prompt
  - The character is claimed while the agent would run (its image, outfit image, description or another prompt in progress, 409); an up-to-date prompt without force is returned as is
adr_refs:
  - adr-0016
  - adr-0018
  - adr-0024
