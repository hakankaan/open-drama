# Read model — a query-optimised projection.
name: EpisodeFilms
description: The export stage — the episode's films newest first (status, duration, poster, path for play/download). The stage reads the selectable shots and their generated state from storyboard.EpisodeShotList.
fields:
  - name: episodeId
    type: ID
  - name: films
    type: "FilmRow[]"
subscribes_to:
  - MergeStarted
  - FilmRendered
  - MergeFailed
used_by:
  - Creator
