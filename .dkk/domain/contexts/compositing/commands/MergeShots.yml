# Command — an instruction to change domain state.
name: MergeShots
description: Render a film from the episode's shots that have videos (all of them, or the given shot ids). Checks FFmpeg availability and clip existence, creates the merge record and starts rendering in the background.
fields:
  - name: episodeId
    type: ID
  - name: shotIds
    type: "ID[]"
    description: Optional subset; still rendered in shot order
actor: Creator
handled_by: Film
preconditions:
  - FFmpeg and FFprobe are executable
  - At least one selected shot has a video
rejections:
  - No selected shot has a video
  - A selected shot's video file is missing on disk
  - FFmpeg unavailable
