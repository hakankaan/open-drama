# Policy — reactive logic that listens to events and emits commands.
name: RunFfmpegConcat
description: >-
  When a merge starts, probe every clip, run FFmpeg's concat filter into the merged media directory (each clip fitted
  into the first clip's frame and frame rate, letterboxed, with a stereo track trimmed to its length or silence when it
  has none; re-encoded to H.264/AAC with faststart), probe the film's duration, then complete or fail the merge.
when:
  events:
    - MergeStarted
then:
  commands:
    - CompleteMerge
    - FailMerge
