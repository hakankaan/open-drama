name: RunFfmpegConcat
description: >-
  When a merge starts, probe every clip, run FFmpeg's concat filter into the merged media directory (each clip graded
  towards its keyframe when colour match is on — half the way, bounded — then fitted into the drama's frame at the
  episode's resolution, or the first clip's for an adaptive drama, at 24 fps, letterboxed, cut to the length it was
  generated at when the provider returned a few frames more, with a stereo track trimmed to that length or silence when
  it has none; a clip that continues the one before it, from the same video, joins it on the frame it started from: the
  one before ends on that frame, the continuing clip starts a frame in and takes its grade, adr-0020; the drama's series
  look over the joined picture), level the mix to -16 LUFS with two-pass loudnorm, re-encode to H.264/AAC with
  faststart, probe the film's duration, then complete or fail the merge.
when:
  events:
    - MergeStarted
then:
  commands:
    - CompleteMerge
    - FailMerge
adr_refs:
  - adr-0019
  - adr-0020
