name: compositing
description: >-
  Turning an episode's shot videos into a film. The creator selects shots, the render worker concatenates them in shot
  order with FFmpeg, and the resulting film is attached to the episode for playback and download.
glossary:
  - term: Merge
    aliases:
      - Final cut
      - Export
    definition: The asynchronous render job that produces a film; tracked with processing / completed / failed.
