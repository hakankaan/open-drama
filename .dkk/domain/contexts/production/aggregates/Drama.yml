name: Drama
description: >-
  A short-drama project — the root under which episodes, characters, scenes and props live. Fixes the aspect ratio and
  the visual style used by every image and video prompt, whether its episodes continue one story (serial), and the
  series look laid over every film (none, warm, cool, teal_orange, faded or mono), and whether its voices are pinned
  (adr-0021).
handles:
  commands:
    - CreateDrama
    - UpdateDrama
    - SaveOutline
    - DeleteDrama
emits:
  events:
    - DramaCreated
    - DramaUpdated
    - OutlineSaved
    - DramaDeleted
invariants:
  - aspectRatio is chosen at creation and never changes afterwards; every video generated for the drama uses it.
  - >-
    style must reference an active StylePreset value at creation; the preset's prompt fragment is prepended to every
    image and video prompt of the drama.
  - Deletion is a soft delete; episodes, assets and generation records stay on disk but become unreachable.
  - >-
    serial defaults to true. When false (an anthology, standalone skits), the agents get the premise but no episode
    recaps and no recap is written.
  - >-
    outline is Markdown of at most 20000 characters (empty until written), the story the episodes are planned from. The
    story writer replaces it only through SaveOutline inside an outline job; the creator edits it from the story tab
    through UpdateDrama, which is refused while an outline job runs, and from an assistant through SaveOutline with the
    revision it read. outlineRevision increments on every change (adr-0016). It joins the SeriesContext of every agent,
    serial or not. The story writer does not start while the planner reads the outline.
  - >-
    pinnedVoices defaults to false. When true, every spoken line is read by the speech service in its character's voice
    and the shot's video is made silent and lip-synced to it; turning it off keeps the line audio and lip syncs made.
adr_refs:
  - adr-0014
  - adr-0015
  - adr-0016
  - adr-0019
  - adr-0021
