# Aggregate — a consistency boundary that handles commands and emits events.
name: ScriptRewriteJob
description: A running AI rewrite for an episode. Wraps the script_rewriter agent run so the studio can poll it, and records failure explicitly; at most one per episode at a time.
handles:
  commands:
    - RewriteScript
emits:
  events:
    - ScriptRewriteRequested
    - ScriptRewriteCompleted
    - ScriptRewriteFailed
invariants:
  - Key is the episode; starting while running returns the running job (alreadyRunning) instead of a second run.
  - Success is judged by a non-empty scriptContent after the run, not by the model's reply.
  - A restart marks a running rewrite as failed.
