name: Episode
description: >-
  One episode of a drama. Holds the raw content and the formatted script with its revision, the recap for the writers of
  later episodes, the locked image/video services and resolution, the target length, the production status and, once merged, the film.
handles:
  commands:
    - CreateEpisode
    - AddPlannedEpisodes
    - UpdateEpisodeContent
    - SaveScript
    - SkipRewrite
    - SaveRecap
    - SetEpisodeResolution
    - SetEpisodeTargetDuration
    - SetEpisodeStatus
    - AttachEpisodeFilm
    - DeleteEpisode
emits:
  events:
    - EpisodeCreated
    - PlannedEpisodesAdded
    - EpisodeContentUpdated
    - ScriptSaved
    - ScriptRewriteSkipped
    - RecapSaved
    - EpisodeResolutionChanged
    - EpisodeTargetDurationChanged
    - EpisodeStatusChanged
    - EpisodeFilmAttached
    - EpisodeDeleted
invariants:
  - >-
    episodeNumber is unique among the drama's non-deleted episodes and assigned as max(existing) + 1, inside the
    transaction that inserts the episode, so a planner batch and a manual Add episode never collide.
  - >-
    An episode is planned when the planner created it: its description is the synopsis and its raw content the beat
    sheet. The planner only appends; an episode the creator added keeps its title, status, resolution, target and
    locks. Deleting a planned episode is the way to reject it.
  - >-
    The script has one agent at a time: a rewrite (RewriteScript) and a write (WriteEpisodeScript) refuse each other
    while running, and a breakdown, the skip, the creator's content edit and the creator's script edit are refused
    while either runs.
  - >-
    imageServiceId and videoServiceId are snapshotted at creation from the highest-priority active model service of each
    type; creation is rejected when either type has no active service.
  - >-
    resolution is one of 480p, 720p or 1080p and applies to every video generated for the episode; adapters map it to
    the provider's nearest tier.
  - >-
    targetDurationSeconds is null (the storyboard follows the script) or a whole number of seconds from 10 to 600. The
    script rewrite is told to write what fits it, and a breakdown is held to it (StoryboardBreakdown). durationSeconds
    stays the sum of the live shots' durations.
  - >-
    status is one of draft, active or completed (the same vocabulary as Drama); completed is a manual mark set from the
    export stage and can be undone.
  - >-
    scriptContent is the single script used downstream. RewriteScript fills it through SaveScript; SkipRewrite copies
    the raw content into it, so a skip is persisted and survives reloads.
  - >-
    scriptRevision increments on every change of scriptContent, whoever writes it; a save of identical text does not
    move it.
  - >-
    recap is at most 2000 characters, written by the recap writer for one script revision or edited by the creator, who
    pins it to the current revision. A recap is stale when its revision is not the script's; staleness is derived, never
    stored.
  - An agent save of a recap for an older script revision is refused; the newer revision has its own recap job.
adr_refs:
  - adr-0014
  - adr-0015
