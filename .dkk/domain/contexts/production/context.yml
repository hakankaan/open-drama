name: production
description: >-
  Dramas (projects) and their episodes — the production lifecycle from raw source text to a finished episode film. Owns
  the per-episode stage rail (script → assets → video production → export) that the studio shows.
glossary:
  - term: Raw content
    definition: The source text the creator pastes (novel chapter, outline, shot list) before any rewrite.
  - term: Formatted script
    definition: >-
      The rewritten shooting script — scene headings (## S01 | INT/EXT · Location | Time), action paragraphs and
      dialogue lines, with no camera language.
    aliases:
      - Script
  - term: Stage rail
    definition: >-
      The per-episode progress indicator. It is derived from data (script present, assets ready, shots with videos, film
      rendered, status completed), never stored directly.
  - term: Locked generation config
    definition: >-
      The image and video model service ids snapshotted onto an episode at creation so later provider changes do not
      silently alter an in-progress episode. Falls back to the active service if the locked one is disabled.
  - term: Project
    definition: >-
      The creator-facing name for a Drama aggregate — a short-drama project that fixes aspect ratio and visual style and
      owns episodes and shared assets.
    aliases:
      - Drama project
  - term: Recap
    definition: >-
      A short account (at most 2000 characters) of what happened in an episode, written for the writers of the next
      episodes, not for viewers: what changed, where things stand, objects that will matter, open threads. Written by
      the recap writer after every saved script of a serial drama and editable by the creator.
  - term: Serial drama
    definition: >-
      A drama whose episodes continue one story ("Episodes continue one story" in the project settings, the default).
      Its agents get the earlier episodes' recaps; an anthology or a set of standalone skits turns it off and gets the
      premise only.
    aliases:
      - Serial
  - term: Script revision
    definition: >-
      A counter on the episode that moves on every change of the script. A recap records the revision it was written
      for and is stale once the script's revision differs; a recap job is keyed by the revision it started from.
  - term: Story outline
    definition: >-
      The drama's story as Markdown (at most 20000 characters): logline, cast, world and tone, the story in acts, the
      season shape (suggested episode count and length) and, for a serial, the threads that carry across episodes.
      Written by the story writer or by hand on the story tab; the planner splits it into episodes and every agent
      reads it in the SeriesContext.
    aliases:
      - Outline
  - term: Beat sheet
    definition: >-
      A planned episode's raw content as written by the episode planner: the beats of the episode in order, 200 to
      6000 characters, ending on the hook into the next episode. The episode writer expands it into the formatted
      script; the creator may edit it first.
    aliases:
      - Beats
