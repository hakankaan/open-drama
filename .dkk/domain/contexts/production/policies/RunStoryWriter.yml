name: RunStoryWriter
description: >-
  When an outline is requested, run the story_writer agent scoped to the drama (agents.RunAgent — a cross-context
  command, see flow StoryDevelopment). The agent reads the premise, the existing outline and the state of every live
  episode and calls SaveOutline; the story tab shows a writing state until the run completes.
when:
  events:
    - OutlineRequested
adr_refs:
  - adr-0006
  - adr-0015
