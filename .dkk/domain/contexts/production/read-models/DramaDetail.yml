# Read model — a query-optimised projection.
name: DramaDetail
description: >-
  The project page — the drama (with its serial flag) with its episodes (number, title, status, resolution, script,
  film and recap presence, recap staleness) and the drama-wide asset library (characters, scenes, props). The studio
  counts the earlier episodes' ready, stale and missing recaps from it before a rewrite.
fields:
  - name: dramaId
    type: ID
  - name: episodes
    type: "EpisodeSummary[]"
  - name: characters
    type: "CharacterSummary[]"
  - name: scenes
    type: "SceneSummary[]"
  - name: props
    type: "PropSummary[]"
subscribes_to:
  - DramaUpdated
  - EpisodeCreated
  - EpisodeContentUpdated
  - ScriptSaved
  - ScriptRewriteSkipped
  - RecapSaved
  - EpisodeResolutionChanged
  - EpisodeTargetDurationChanged
  - EpisodeStatusChanged
  - EpisodeFilmAttached
  - EpisodeDeleted
used_by:
  - Creator
