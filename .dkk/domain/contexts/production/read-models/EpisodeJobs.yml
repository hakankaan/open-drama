# Read model — a query-optimised projection.
name: EpisodeJobs
description: >-
  The latest job per kind for an episode — rewrite, extraction per target, storyboard breakdown, video-prompt batch
  and recap (the latest one whichever script revision keyed it) — with status (running / done / failed), progress and
  error, so the studio polls one endpoint while anything runs. Extraction, breakdown and prompt-batch jobs are owned
  by the assets and storyboard contexts; this projection reads their rows.
fields:
  - name: episodeId
    type: ID
  - name: rewrite
    type: JobStatus
  - name: extraction
    type: JobStatusByTarget
  - name: breakdown
    type: JobStatus
  - name: videoPromptBatch
    type: JobStatus
  - name: recap
    type: JobStatus
subscribes_to:
  - ScriptRewriteRequested
  - ScriptRewriteCompleted
  - ScriptRewriteFailed
  - RecapRequested
  - RecapCompleted
  - RecapFailed
used_by:
  - Creator
