name: PlanEpisodes
description: >-
  Ask the episode planner to split the drama's outline into a given number of new episodes, each with a title, a
  synopsis and a beat sheet, appended after the existing ones with the chosen resolution, target length and locked
  services. The request is written to the job's progress at start.
fields:
  - name: dramaId
    type: ID
  - name: count
    type: number
    description: How many episodes to add, 1 to 50
  - name: targetDurationSeconds
    type: number
    description: Optional target length applied to every new episode
  - name: resolution
    type: string
    description: 480p | 720p | 1080p, default 720p
  - name: imageServiceId
    type: ID
    description: Optional image service to lock; else the highest-priority active one
  - name: videoServiceId
    type: ID
    description: Optional video service to lock; else the highest-priority active one
  - name: model
    type: string
    description: Optional text model override
  - name: textServiceId
    type: ID
    description: Optional text service override
actor: Creator
handled_by: EpisodePlanJob
preconditions:
  - An active image and an active video model service exist (the same rule as CreateEpisode)
  - The drama has an outline or a synopsis
  - No outline job is running for the drama
  - If a plan is already running for the drama, the running job is returned (alreadyRunning)
rejections:
  - Drama not found or deleted
  - No active image or video service (worded as CreateEpisode)
  - Neither outline nor synopsis
  - An outline is being written
  - No text model service configured
adr_refs:
  - adr-0015
