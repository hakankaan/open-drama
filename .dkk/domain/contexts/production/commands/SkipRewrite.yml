name: SkipRewrite
description: >-
  Skip the AI rewrite by copying the raw content into scriptContent, so extraction and storyboard breakdown use it and
  the skip is persisted (the stage rail shows the script as done after a reload). In a serial drama the recap job
  starts at once and its id is returned with the episode (useContentAsScript in the service layer, adr-0016); an
  existing script is replaced only when replace is set.
fields:
  - name: episodeId
    type: ID
  - name: replace
    type: boolean
    description: Replace an existing script (the studio's button sets it; an assistant must ask first)
actor: Creator
handled_by: Episode
preconditions:
  - Raw content is not empty
  - No rewrite or write job is running for the episode
  - No breakdown or extraction is reading the script
rejections:
  - Empty raw content
  - A script exists and replace is not set
  - The script is being rewritten or written
  - A breakdown or an extraction is reading the script
adr_refs:
  - adr-0015
  - adr-0016
