name: UpdateEpisodeContent
description: >-
  Save the creator's edits to an episode's raw content, formatted script, recap, title or description. A recap is pinned
  to the current script revision; with scriptContent in the same command the script is written first and the recap
  pinned to the new revision.
fields:
  - name: episodeId
    type: ID
  - name: content
    type: string
    description: Raw source text
  - name: scriptContent
    type: string
    description: Formatted script (manual edits)
  - name: recap
    type: string
    description: The episode's recap (manual edits), at most 2000 characters
  - name: title
    type: string
  - name: description
    type: string
actor: Creator
handled_by: Episode
rejections:
  - No updatable field supplied
  - scriptContent while the script is being rewritten or written (the agent's save would replace the edit)
  - scriptContent while a breakdown or an extraction reads the script (its shots or assets would no longer match)
  - content while the script is being rewritten or written (the agent reads it as its source)
  - recap while the recap is being written
adr_refs:
  - adr-0008
  - adr-0015
