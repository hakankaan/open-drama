name: AddPlannedEpisodes
description: >-
  Persist one batch of planned episodes produced by the episode planner (its save_episodes tool) as new Episode rows
  whose raw content is the beat sheet. One transaction per batch: the next numbers are taken inside it, the rows are
  inserted complete through the same insert CreateEpisode uses, and the new ids are appended to the job's progress.
fields:
  - name: dramaId
    type: ID
  - name: episodes
    type: PlannedEpisode[]
    description: At most 8 per batch — title (≤120), synopsis (≤2000), beats (200–6000 characters)
  - name: final
    type: boolean
    description: True on the last batch; accepted only once exactly count of the added episodes are live
actor: AgentRuntime
handled_by: Episode
preconditions:
  - Called inside a plan job whose progress row holds the request
rejections:
  - Items beyond the requested count
  - A title, synopsis or beat sheet outside its bounds
  - final while fewer than count of the added episodes are still live (the shortfall is named)
  - Called outside a plan job
adr_refs:
  - adr-0015
