name: UpdateDrama
description: >-
  Update a drama's title, description, genre, style, status, tags, serial flag or outline (the creator's edit from the
  story tab). The aspect ratio is immutable and is ignored if supplied.
fields:
  - name: dramaId
    type: ID
  - name: title
    type: string
  - name: description
    type: string
  - name: genre
    type: string
  - name: style
    type: string
  - name: status
    type: string
    description: draft | active | completed (project-level status shown on the launcher)
  - name: tags
    type: string[]
  - name: serial
    type: boolean
  - name: outline
    type: string
    description: Markdown, at most 20000 characters; empty clears it
actor: Creator
handled_by: Drama
rejections:
  - Drama not found or deleted
  - outline while an outline job is running (the agent's save would replace the edit)
adr_refs:
  - adr-0015
