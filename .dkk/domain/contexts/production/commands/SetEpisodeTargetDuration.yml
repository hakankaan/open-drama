# Command — an instruction to change domain state.
name: SetEpisodeTargetDuration
description: >-
  Set how long the episode should run on screen, in whole seconds, or clear it so the storyboard follows the script.
  The script rewrite and the storyboard breakdown fit the episode to it; the current script and shots are left as they
  are until they are rewritten or broken down again.
fields:
  - name: episodeId
    type: ID
  - name: targetDurationSeconds
    type: number
    description: 10-600, or null to clear
actor: Creator
handled_by: Episode
rejections:
  - targetDurationSeconds is not a whole number from 10 to 600
