name: StoreRemoteFile
description: Download a provider result URL into the images or videos directory and return the relative path.
fields:
  - name: url
    type: string
  - name: kind
    type: string
    description: image | video
actor: GenerationWorker
handled_by: MediaFile
rejections:
  - Download failed (HTTP error or timeout)
adr_refs:
  - adr-0009
