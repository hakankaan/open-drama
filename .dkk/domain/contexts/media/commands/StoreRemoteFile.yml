name: StoreRemoteFile
description: >-
  Download a provider result URL into the images or videos directory and return the relative path. The URL comes from
  the provider's response, so the download goes through the same guarded fetch as remote reference images: loopback,
  link-local and cloud-metadata addresses are refused on every hop, except the service's own configured host (a local
  relay), and the file is capped at 200 MB. The body is streamed to a temporary file; a timeout, a dropped connection
  or an HTTP 5xx, 429 or 408 is retried after 5 and 20 seconds. An image's format is read from its bytes and names its
  extension; SVG and unknown formats are refused, so nothing served from /static can run script.
fields:
  - name: url
    type: string
  - name: kind
    type: string
    description: image | video
  - name: serviceBaseUrl
    type: string
    description: The base URL of the service that produced the result; its host is reached without the address check.
actor: GenerationWorker
handled_by: MediaFile
rejections:
  - Download failed (HTTP error or timeout)
  - The URL, or a redirect, points at a loopback, link-local or cloud-metadata address
  - The result is larger than 200 MB
  - An image result is not PNG, JPEG, WebP, GIF or AVIF
adr_refs:
  - adr-0009
