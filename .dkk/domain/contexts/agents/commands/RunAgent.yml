name: RunAgent
description: >-
  Run one agent with a user message scoped to an episode and drama. Used by the production, assets and storyboard
  contexts (rewrite, extraction, breakdown, prompts) and by the debugging chat endpoint.
fields:
  - name: agentType
    type: string
    description: script_rewriter | extractor | storyboard_breaker | prompt_generator
  - name: message
    type: string
  - name: episodeId
    type: ID
  - name: dramaId
    type: ID
  - name: model
    type: string
  - name: textServiceId
    type: ID
  - name: maxSteps
    type: number
actor: AgentRuntime
handled_by: AgentRun
preconditions:
  - A text model service is resolvable
rejections:
  - Unknown agent type
  - No text model service configured
adr_refs:
  - adr-0006
