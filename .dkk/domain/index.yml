contexts:
  - name: production
    description: 'Dramas (projects) and their episodes: the production lifecycle from raw source text to a finished episode film.'
  - name: assets
    description: Characters, scenes and props extracted from a script, their final image prompts and reference images.
  - name: storyboard
    description: Storyboard breakdown of an episode into shots, per-shot video prompts, reference bindings and shot videos.
  - name: generation
    description: 'Provider-agnostic image and video generation tasks: submission, dispatch, polling and result persistence.'
  - name: compositing
    description: Merging shot videos into an episode film with FFmpeg and exporting it.
  - name: media
    description: 'Local media storage: uploads, persisted generation results, thumbnails, poster frames and static serving.'
  - name: configuration
    description: Model service configuration (text/image/video providers), style presets and application settings.
  - name: agents
    description: 'The agent runtime: production agents, their editable prompts and skills, and agent runs against the domain.'
flows:
  - name: FirstRunSetup
    description: >-
      A fresh install has no model services. The creator either applies a quick setup key or adds services manually,
      tests connectivity, and the readiness banner clears once text, image and video each have an active service.
    steps:
      - ref: configuration.ConfigurationReadiness
        type: read_model
        note: Banner shows which service types are missing
      - ref: configuration.ApplyQuickSetup
        type: command
        note: Or AddModelService per type
      - ref: configuration.ModelServiceAdded
        type: event
      - ref: configuration.TestModelService
        type: command
      - ref: configuration.ModelServiceProbed
        type: event
      - ref: configuration.ActiveModelServices
        type: read_model
        note: Episode creation locks the highest-priority active image and video services
  - name: ScriptStage
    description: >-
      The creator creates a drama and an episode, pastes raw content and lets the script rewriter agent produce a
      formatted script (or skips the rewrite); in a serial drama the saved script then gets its recap for the next
      episodes.
    steps:
      - ref: production.CreateDrama
        type: command
      - ref: production.DramaCreated
        type: event
      - ref: production.CreateEpisode
        type: command
        note: Locks image/video services and resolution
      - ref: production.EpisodeCreated
        type: event
      - ref: production.UpdateEpisodeContent
        type: command
        note: Raw content pasted and saved
      - ref: production.RewriteScript
        type: command
      - ref: production.ScriptRewriteRequested
        type: event
      - ref: production.RunScriptRewriter
        type: policy
      - ref: agents.RunAgent
        type: command
        note: script_rewriter agent reads the raw content and calls SaveScript
      - ref: production.SaveScript
        type: command
      - ref: production.ScriptSaved
        type: event
      - ref: production.ScriptRewriteCompleted
        type: event
        note: Or ScriptRewriteFailed; the studio polls EpisodeJobs
      - ref: production.EpisodePipelineStatus
        type: read_model
        note: Script stage shows done
      - ref: production.WriteRecapAfterScript
        type: policy
        note: Serial dramas only; also after SkipRewrite
      - ref: production.WriteRecap
        type: command
      - ref: production.RecapRequested
        type: event
      - ref: production.RunRecapWriter
        type: policy
      - ref: agents.RunAgent
        type: command
        note: recap_writer reads the script and the SeriesContext, then calls SaveRecap
      - ref: production.SeriesContext
        type: read_model
        note: Premise and earlier recaps (ready, stale, missing); the rewriter and breaker read it too
      - ref: production.SaveRecap
        type: command
        note: Refused when the script revision moved on
      - ref: production.RecapSaved
        type: event
      - ref: production.RecapCompleted
        type: event
        note: Or RecapFailed; the recap card polls EpisodeJobs and lets the creator edit or rewrite the recap
    adr_refs:
      - adr-0014
  - name: StoryDevelopment
    description: >-
      The layer above the script stage. The story writer turns the project's premise into a story outline the creator
      edits on the story tab; the episode planner splits the outline into new episodes with a synopsis and a beat sheet
      each; the episode writer expands one episode's beats into the formatted script, after which the script stage
      continues as usual (recap, assets, storyboard).
    steps:
      - ref: production.WriteOutline
        type: command
        note: From the story tab; a rewrite asks for confirmation
      - ref: production.OutlineRequested
        type: event
      - ref: production.RunStoryWriter
        type: policy
      - ref: agents.RunAgent
        type: command
        note: >-
          story_writer (drama-scoped) reads the premise, the draft outline and the episode states, then calls
          SaveOutline
      - ref: production.SaveOutline
        type: command
      - ref: production.OutlineSaved
        type: event
      - ref: production.OutlineCompleted
        type: event
        note: Or OutlineFailed; the story tab polls DramaJobs
      - ref: production.UpdateDrama
        type: command
        note: The creator edits the outline by hand; refused while an outline job runs
      - ref: production.PlanEpisodes
        type: command
        note: Count, target length, resolution and locks from the plan dialog; refused during an outline job
      - ref: production.EpisodePlanRequested
        type: event
      - ref: production.RunEpisodePlanner
        type: policy
      - ref: agents.RunAgent
        type: command
        note: >-
          episode_planner (drama-scoped) reads the outline and every live episode's state, then calls AddPlannedEpisodes
          per batch
      - ref: production.AddPlannedEpisodes
        type: command
        note: One transaction per batch of at most 8; final only once count episodes are live
      - ref: production.PlannedEpisodesAdded
        type: event
      - ref: production.DramaJobs
        type: read_model
        note: The episodes tab shows how many of the requested episodes are planned and refreshes as batches land
      - ref: production.EpisodePlanCompleted
        type: event
        note: Or EpisodePlanFailed; the episodes added so far stay
      - ref: production.WriteEpisodeScript
        type: command
        note: From the script stage ("Expand the beats into a script"); refused while a rewrite runs
      - ref: production.EpisodeWriteRequested
        type: event
      - ref: production.RunEpisodeWriter
        type: policy
      - ref: agents.RunAgent
        type: command
        note: >-
          episode_writer (episode-scoped) reads the beats, the SeriesContext (with the outline) and the next episode's
          beats, then calls SaveScript
      - ref: production.SeriesContext
        type: read_model
        note: Premise, outline and earlier recaps; budget 60000 characters, only recaps are dropped
      - ref: production.SaveScript
        type: command
      - ref: production.ScriptSaved
        type: event
      - ref: production.EpisodeWriteCompleted
        type: event
        note: Or EpisodeWriteFailed; the script stage polls EpisodeJobs
      - ref: production.WriteRecapAfterScript
        type: policy
        note: The recap chain of ScriptStage continues unchanged
    adr_refs:
      - adr-0015
  - name: AssetStage
    description: >-
      Characters, scenes and props are extracted from the script by the extractor agent (deduplicated against the
      drama), each gets a final prompt from the prompt generator, and a reference image is generated or uploaded.
    steps:
      - ref: assets.StartExtraction
        type: command
        note: One job per episode and target type; types run in parallel
      - ref: assets.ExtractionStarted
        type: event
      - ref: assets.RunExtractorAgent
        type: policy
      - ref: agents.RunAgent
        type: command
      - ref: assets.SaveExtractedCharacters
        type: command
        note: >-
          Also SaveExtractedScenes / SaveExtractedProps; an asset designed from the story (flow AssetDesign) is linked
          here by its name, and a character the script shows in other clothes is dressed for the episode (adr-0024)
      - ref: assets.CharactersExtracted
        type: event
      - ref: assets.ExtractionCompleted
        type: event
      - ref: assets.RequestCharacterImage
        type: command
        note: Ensures a final prompt first (GenerateCharacterFinalPrompt), then requests the image
      - ref: assets.CharacterImageRequested
        type: event
      - ref: assets.SubmitAssetImageGeneration
        type: policy
      - ref: generation.SubmitImageGeneration
        type: command
      - ref: generation.ImageGenerated
        type: event
      - ref: assets.AttachAssetImageOnGeneration
        type: policy
      - ref: assets.CharacterImageAttached
        type: event
      - ref: assets.EpisodeAssets
        type: read_model
        note: Readiness per asset feeds the stage rail
  - name: AssetDesign
    description: >-
      Before any episode exists, the asset designer turns the story outline into the drama's cast, places and props
      (adr-0024): one job per kind, the three in parallel, each run offered the story, the kind's existing assets and
      the kind's one save. Nothing is linked to an episode; the extractor links a designed asset when a script uses it
      (flow AssetStage). The designed assets get their final prompts and reference images from the project page's
      library, with no episode. An asset created by hand is described one at a time by the same designer, in the
      request.
    steps:
      - ref: assets.DesignAssets
        type: command
        note: >-
          Refused without an outline (412) and while the outline is being written (409); a duplicate start returns the
          running job
      - ref: assets.AssetDesignRequested
        type: event
        note: The outline revision the run starts from is recorded on the job
      - ref: assets.RunAssetDesigner
        type: policy
      - ref: agents.RunAgent
        type: command
        note: >-
          asset_designer with the run's tool allowlist (read_story_for_design, read_existing_<kind>,
          save_designed_<kind>)
      - ref: assets.SaveDesignedCharacters
        type: command
        note: >-
          Also SaveDesignedScenes / SaveDesignedProps; one call with the whole set, capped at 12 / 10 / 5 with the
          overflow named back
      - ref: assets.DesignedAssetsSaved
        type: event
      - ref: assets.AssetDesignCompleted
        type: event
      - ref: assets.DramaAssetLibrary
        type: read_model
        note: The Story tab shows the counts and the stale note when the outline moved on, and links to the library
      - ref: assets.DescribeAsset
        type: command
        note: >-
          One asset made by hand, described in the request; the run is offered read_story_for_design,
          read_existing_<kind> and describe_<kind>, never the bulk save
      - ref: assets.AssetDescribed
        type: event
  - name: StoryboardAndVideoStage
    description: >-
      The storyboard breaker agent splits the script into shots with descriptions, bindings and video prompts; the
      creator reviews prompts, binds references, picks the video model and generates each shot video (singly or in
      batch, with retry of failures).
    steps:
      - ref: storyboard.BreakdownStoryboard
        type: command
      - ref: storyboard.StoryboardBreakdownRequested
        type: event
      - ref: storyboard.RunStoryboardBreaker
        type: policy
      - ref: agents.RunAgent
        type: command
        note: storyboard_breaker agent saves shots in batches of at most 8
      - ref: storyboard.SaveShots
        type: command
      - ref: storyboard.ShotsSaved
        type: event
      - ref: storyboard.StoryboardBreakdownCompleted
        type: event
      - ref: storyboard.StartVideoPromptBatch
        type: command
        note: Fills missing video prompts; optional for selected shots
      - ref: storyboard.RunVideoPromptGenerator
        type: policy
      - ref: storyboard.ShotVideoPromptSaved
        type: event
      - ref: storyboard.RequestShotVideo
        type: command
        note: '@[Name] mentions resolve to ordered reference slots; style prompt is prepended'
      - ref: storyboard.ShotVideoRequested
        type: event
      - ref: storyboard.SubmitShotVideoGeneration
        type: policy
      - ref: generation.SubmitVideoGeneration
        type: command
      - ref: generation.VideoGenerated
        type: event
      - ref: storyboard.AttachShotVideoOnGeneration
        type: policy
      - ref: storyboard.ShotVideoAttached
        type: event
      - ref: storyboard.EpisodeShotList
        type: read_model
  - name: MergeAndExport
    description: >-
      The creator selects shots that have videos, the render worker concatenates them with FFmpeg into a film, the film
      is attached to the episode, and the creator downloads it and marks the episode done.
    steps:
      - ref: compositing.MergeShots
        type: command
        note: Only shots with an existing video file; shot order preserved
      - ref: compositing.MergeStarted
        type: event
      - ref: compositing.RunFfmpegConcat
        type: policy
      - ref: compositing.CompleteMerge
        type: command
      - ref: compositing.FilmRendered
        type: event
      - ref: compositing.DerivePosterForFilm
        type: policy
      - ref: media.DeriveRenditions
        type: command
      - ref: compositing.PublishFilmToEpisode
        type: policy
      - ref: production.AttachEpisodeFilm
        type: command
      - ref: production.EpisodeFilmAttached
        type: event
      - ref: compositing.EpisodeFilms
        type: read_model
        note: Film list with play and download
      - ref: production.SetEpisodeStatus
        type: command
        note: Mark done (completed) — toggleable
      - ref: production.EpisodeStatusChanged
        type: event
  - name: GenerationTaskLifecycle
    description: >-
      Every image or video generation, whatever triggered it, follows one lifecycle - a task row is created, the adapter
      builds the provider request, the worker submits and polls, the result is persisted to local media storage and then
      written back to the owner.
    steps:
      - ref: generation.SubmitImageGeneration
        type: command
        note: Or SubmitVideoGeneration
      - ref: generation.GenerationTaskSubmitted
        type: event
      - ref: generation.DispatchOnSubmit
        type: policy
      - ref: generation.DispatchGenerationTask
        type: command
        note: Reference material normalised (local paths to data URLs or public URLs)
      - ref: generation.GenerationTaskDispatched
        type: event
      - ref: generation.PollUntilSettled
        type: policy
      - ref: generation.PollGenerationTask
        type: command
      - ref: generation.ProviderResultReceived
        type: event
      - ref: generation.PersistProviderResult
        type: policy
      - ref: media.StoreRemoteFile
        type: command
        note: Or StoreInlineImage for base64 results
      - ref: media.MediaStored
        type: event
      - ref: media.DeriveRenditionsOnStore
        type: policy
      - ref: generation.CompleteGenerationTask
        type: command
      - ref: generation.ImageGenerated
        type: event
        note: Or VideoGenerated; owners attach the local path
      - ref: generation.GenerationTaskStatus
        type: read_model
        note: The UI polls this until the task settles
    adr_refs:
      - adr-0005
  - name: AgentRun
    description: >-
      How any agent run is assembled - the caller names the agent and scope, the runtime composes instructions from the
      prompt file, skills and content language, resolves the text model, and loops on tool calls until the agent stops.
    steps:
      - ref: agents.RunAgent
        type: command
      - ref: agents.AgentRunStarted
        type: event
      - ref: agents.AgentCatalog
        type: read_model
        note: Prompt file plus skills for the agent, in the content language
      - ref: configuration.ActiveModelServices
        type: read_model
        note: Text model service, unless the request overrides model or service
      - ref: agents.AgentRunCompleted
        type: event
        note: Or AgentRunFailed; success is judged by what the tools persisted
    adr_refs:
      - adr-0006
  - name: AssistantStoryCreation
    description: >-
      The creator works from their AI assistant instead of the studio (adr-0016). The assistant loads the create-story
      skill, checks readiness, creates the project, has the story writer draft the outline, lets the creator review and
      edit it in the conversation, plans the episodes, has the asset designer design the cast, places and props from the
      outline and sends the creator to the studio's asset library for their images (adr-0024), then writes each episode
      in order with its recap; every stage is reviewed in the conversation before the next starts. The studio, if it
      runs, shows the same project.
    steps:
      - ref: configuration.ConfigurationReadiness
        type: read_model
        note: get_status; a text service is enough for the story room
      - ref: production.CreateDrama
        type: command
        note: create_drama with the brief the creator agreed to
      - ref: production.WriteOutline
        type: command
        note: write_outline starts the story writer; refused with replace unset once an outline exists
      - ref: production.OutlineRequested
        type: event
      - ref: production.DramaJobs
        type: read_model
        note: wait_for_job until the outline job settles
      - ref: production.OutlineCompleted
        type: event
      - ref: production.SaveOutline
        type: command
        note: save_outline for the creator's edits, with ifRevision from the last read
      - ref: production.PlanEpisodes
        type: command
        note: plan_episodes once the outline is approved; episodes are created without locked services
      - ref: production.PlannedEpisodesAdded
        type: event
      - ref: assets.DesignAssets
        type: command
        note: >-
          design_assets per kind once the plan is reviewed, the three side by side; wait_for_job reports what each
          saved, filled, skipped or could not fit
      - ref: assets.AssetDesignCompleted
        type: event
      - ref: assets.DramaAssetLibrary
        type: read_model
        note: >-
          list_assets to present the cast, places and props; edits through update_asset, describe_asset (replace) and
          delete_asset (confirm); the images are drawn in the studio's asset library, since generate_asset_image waits
          for the paid-generation setting
      - ref: production.WriteEpisodeScript
        type: command
        note: write_episode_script per episode, in order; refused while an earlier recap is pending
      - ref: production.EpisodeWriteCompleted
        type: event
      - ref: production.WriteRecapAfterScript
        type: policy
        note: the recap job starts by itself in a serial; its id is in the write job's result
      - ref: production.EpisodeJobs
        type: read_model
        note: wait_for_job on the recap before the next episode is written
    adr_refs:
      - adr-0016
      - adr-0024
